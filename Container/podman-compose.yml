services:
  lan-camera:
    container_name: lan-camera
    build: .
    privileged: true
    restart: unless-stopped
    network_mode: host
    mem_limit: "1G"
    cpus: 1
    ports:
      - "8889:8889"
      - "5000:5000"
      - "8554:8554"
    volumes:
      - /dev:/dev:ro
      - /run/udev:/run/udev:ro
      - /dev/dma_heap:/dev/dma_heap:ro
      
      - /usr/share/libcamera:/usr/share/libcamera:ro
      - /usr/lib/x86_64-linux-gnu/libcamera:/usr/lib/x86_64-linux-gnu/libcamera:ro
      - /usr/lib/firmware/intel:/usr/lib/firmware/intel:ro
      - /usr/lib/modules/6.17.13-surface-2/kernel/drivers/media:/usr/lib/modules/6.17.13-surface-2/kernel/drivers/media:ro
    environment:
      - PYTHONUNBUFFERED=1
